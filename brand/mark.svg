<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Legacy Vault seal">
  <defs>
    <radialGradient id="waxBody" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#B8443C"/>
      <stop offset="52%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#701E1B"/>
    </radialGradient>
  </defs>

  <!-- Irregular wax blob: gentle wobble (not a faceted gem), one soft drip
       at lower-right (~5 o'clock, the shadow side). Raised material -> the
       gradient's light point (35%/30%) reads as the single upper-left
       light source; it darkens toward the bottom-right edge. -->
  <path fill="url(#waxBody)" d="
    M100.00,26.00
    C113.90,25.89 116.90,24.08 129.28,29.32
    C141.65,34.57 142.33,38.08 151.97,48.03
    C161.61,57.98 164.51,58.73 169.75,71.11
    C175.00,83.48 174.55,86.47 174.00,100.00
    C173.45,113.53 172.35,115.22 167.44,127.94
    C162.54,140.65 159.56,142.92 153.39,153.39
    C147.21,163.85 150.47,167.01 141.50,171.88
    C132.53,176.75 125.58,173.46 115.70,173.85
    C105.82,174.24 110.66,174.37 100.00,173.50
    C89.34,172.63 83.21,175.42 70.92,170.21
    C58.63,165.01 58.06,161.46 48.38,151.62
    C38.70,141.78 35.58,141.18 30.25,128.89
    C24.92,116.60 26.22,113.85 26.00,100.00
    C25.78,86.15 23.99,83.01 29.32,70.72
    C34.65,58.43 38.48,58.13 48.38,48.38
    C58.28,38.63 58.63,35.11 70.92,29.79
    C83.21,24.46 86.10,26.11 100.00,26.00
    Z
  "/>

  <!-- Fine broken inner ring, echoing a real seal die -->
  <circle cx="100" cy="99" r="55" fill="none" stroke="#5A1815" stroke-width="1.6"
          stroke-dasharray="10 4 6 3 14 5 5 7 9 4" opacity="0.5"/>

  <!-- LV monogram, letterpressed into the wax. The two letters genuinely
       interlock (V's vertex lands inside L's foot; V's left stroke overlaps
       L's stem at the top) rather than sitting side by side with a gap.
       The deboss is a dark sliver top-left / light sliver bottom-right at a
       small offset -- a hint of a groove, not a drop shadow. -->
  <g transform="translate(61,64)">
    <g transform="translate(-0.8,-0.8)" fill="#4A1512" opacity="0.5">
      <path d="M8,6 L20,6 L20,50 L48,50 L48,60 L8,60 Z"/>
      <path d="M18,6 L44,56 L70,6 L62,6 L44,40 L26,6 Z"/>
    </g>
    <g transform="translate(0.8,0.8)" fill="#C97B6F" opacity="0.4">
      <path d="M8,6 L20,6 L20,50 L48,50 L48,60 L8,60 Z"/>
      <path d="M18,6 L44,56 L70,6 L62,6 L44,40 L26,6 Z"/>
    </g>
    <g fill="#87231D">
      <path d="M8,6 L20,6 L20,50 L48,50 L48,60 L8,60 Z"/>
      <path d="M18,6 L44,56 L70,6 L62,6 L44,40 L26,6 Z"/>
    </g>
  </g>
</svg>
